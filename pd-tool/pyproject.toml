[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-divergence"
version = "0.1.0"
description = "An offline index of where language models silently misread locally defined terms, computed with a small local model."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.44,<5", "accelerate>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pd = "pd.cli:main"

[tool.setuptools]
packages = ["pd"]
